services:
	postgres:
		image: postgis/postgis:16-3.4
		container_name: orca-postgis
		restart: unless-stopped
		environment:
			POSTGRES_DB: orca
			POSTGRES_USER: orca
			POSTGRES_PASSWORD: orca_dev_password
		ports:
			- "5433:5432"
		volumes:
			- orca_postgres_data:/var/lib/postgresql/data
		healthcheck:
			test: ["CMD-SHELL", "pg_isready -U orca -d orca"]
			interval: 5s
			timeout: 5s
			retries: 10

volumes:
	orca_postgres_data:
